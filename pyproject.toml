[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-wpa-analysis"
version = "0.1.0"
description = "Reproducible MLB WPA collection and EOWS v1.0 research"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.5", "numpy>=1.26,<3", "pandas>=2.2,<4",
    "matplotlib>=3.8,<4", "seaborn>=0.13,<0.14", "scipy>=1.12,<2",
    "pybaseball>=2.2,<3", "beautifulsoup4>=4.12,<5", "pyarrow==26.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
notebooks = ["nbformat>=5.10,<6", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
